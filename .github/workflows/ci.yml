name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    # The container matches the machine this is developed on, so CI exercises
    # the same compiler versions rather than an approximation of them.
    container: fedora:43
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            preset: fedora-gcc
          - compiler: clang
            preset: fedora-clang

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc-c++ clang cmake ninja-build libcurl-devel openssl-devel git

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DASH_WERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    container: fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          clang cmake ninja-build libcurl-devel openssl-devel git

      - name: Configure
        run: cmake --preset fedora-clang-asan

      - name: Build
        run: cmake --build --preset fedora-clang-asan

      # Leak detection stays on: a runtime that hands out stop_sources and
      # journals is exactly where a forgotten ownership edge shows up.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset fedora-clang-asan --output-on-failure

  replay-determinism:
    name: replay determinism (offline)
    runs-on: ubuntu-24.04
    container: fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc-c++ cmake ninja-build libcurl-devel openssl-devel git python3

      - name: Configure
        run: cmake --preset fedora-clang

      - name: Build
        run: cmake --build --preset fedora-clang

      # The headline claim, checked on every push: a recorded run replays
      # byte-identically a hundred times, with the model server shut down and no
      # API key anywhere in the environment.
      - name: Verify replay determinism
        env:
          REPLAYS: 100
        run: ./tools/verify_replay.sh build/fedora-clang/apps/cli/ash

      # The other half of the claim: a streamed run is the same run as a plain
      # one. Both are recorded against the stub and the journals are diffed, so
      # a change that quietly made streaming a second kind of call fails here.
      - name: Verify streaming equivalence
        run: ./tools/verify_streaming.sh build/fedora-clang/apps/cli/ash

  eval-offline:
    name: eval (offline, no key)
    runs-on: ubuntu-24.04
    container: fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc-c++ cmake ninja-build libcurl-devel openssl-devel git

      - name: Configure
        run: cmake --preset fedora-clang

      - name: Build
        run: cmake --build --preset fedora-clang

      # Every job replays a committed journal, so this grades a real agent run
      # on every push and costs nothing. The baseline is committed too, so the
      # diff is exercised rather than assumed -- a code change that breaks a
      # check, or a fixture that was quietly re-recorded, both show up here.
      # pipefail matters: without it the exit status would be tee's, and a
      # failing eval would pass as long as it printed something.
      - name: Grade the suite against the committed baseline
        run: |
          set -o pipefail
          ./build/fedora-clang/apps/cli/ash eval \
            --suite examples/suites/core.json \
            --baseline eval/baseline/core.json \
            --json eval-report.json | tee eval-output.txt

      - name: Add the data table to the run summary
        if: always()
        run: |
          {
            echo '## Offline eval'
            echo
            echo 'Graded from committed journals: no API key, no network, no cost.'
            echo
            echo '```'
            cat eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept even when the eval fails, since the report is how you find out why.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval-report.json
            eval-output.txt
